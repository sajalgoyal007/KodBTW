server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: kodbtw-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

app:
  public-site-url: ${PUBLIC_SITE_URL:https://kodbtw.vercel.app}
  clist:
    username: ${CLIST_USERNAME:}
    api-key: ${CLIST_API_KEY:}
    base-url: ${CLIST_BASE_URL:https://clist.by/api/v4}
  contests:
    sync-cron: ${CONTEST_SYNC_CRON:0 0 */6 * * *}
    sync-enabled: ${CONTEST_SYNC_ENABLED:true}
  google-auth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:KodBTW <onboarding@resend.dev>}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
  verification:
    token-validity: ${EMAIL_VERIFICATION_TOKEN_VALIDITY:PT24H}
    cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

platform:
  sync:
    cooldown: ${PLATFORM_SYNC_COOLDOWN:PT15M}

contest-calendar:
  provider: ${CONTEST_CALENDAR_PROVIDER:codeforces}
  cache-ttl: ${CONTEST_CALENDAR_CACHE_TTL:PT10M}
  fixture:
    scenario: ${CONTEST_CALENDAR_FIXTURE_SCENARIO:multiple}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
