server:
  port: 8080

spring:
  application:
    name: kodbtw-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kodbtw?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9mb3Jfa29kYnR3X2RldmVsb3BtZW50X29ubHlfMjU2Yml0c19sb25n}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
