# Test configuration for @SpringBootTest integration tests.
# Uses H2 in-memory database. Flyway is disabled; JPA auto-creates schema from entities.
spring:
  datasource:
    url: jdbc:h2:mem:kodbtw_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

jwt:
  secret: dGVzdF9zZWNyZXRfa2V5X2Zvcl91bml0X3Rlc3RzX29ubHlfbXVzdF9iZV8yNTZfYml0c19sb25n
  expiration-ms: 86400000
